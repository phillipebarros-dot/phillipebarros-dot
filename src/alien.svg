<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900" role="img" aria-label="WEYLAN-YUTANI MU/TH/UR 6000">
  <defs>
    <style>
      /*FONTS*/
      .t{font-family:'STM',Consolas,monospace;font-size:13px;fill:#FFB000;letter-spacing:2px}
      .th{font-family:'CP',sans-serif;fill:#FFB000}
      .dim{opacity:.5}
      .vdim{opacity:.3}

      /* Lines always visible — typing is bonus on GitHub */
      .ln1,.ln2,.ln3,.ln4,.ln5,.ln6,.ln7,.ln8,.ln9,.ln10,
      .ln11,.ln12,.ln13,.ln14,.ln15,.ln16,.ln17,.ln18,.ln19,.ln20,
      .ln21,.ln22,.ln23,.ln24,.ln25,.ln26,.ln27,.ln28,.ln29,.ln30,
      .ln31,.ln32,.ln33,.ln34,.ln35{opacity:1}

      /* Cursor blink */
      .cur{animation:bk 1s steps(1) infinite}
      @keyframes bk{50%{opacity:0}}

      /* Alert flash — for CREW EXPENDABLE */
      .alert{animation:alt 1.5s steps(1) infinite}
      @keyframes alt{0%,100%{fill:#FF3300;opacity:1}50%{fill:#FFB000;opacity:.7}}

      /* CRT flicker */
      .flk{animation:flk 8s ease-in-out infinite}
      @keyframes flk{0%,100%{opacity:.9}50%{opacity:1}}

      /* Scan sweep */
      .sweep{animation:sw 5s linear infinite}
      @keyframes sw{0%{transform:translateY(-920px);opacity:0}5%{opacity:.08}10%{opacity:.08}15%{opacity:0}100%{transform:translateY(920px);opacity:0}}

      /* Warning pulse */
      .pulse{animation:pls 2s ease-in-out infinite}
      @keyframes pls{0%,100%{opacity:.4}50%{opacity:1}}
    </style>
    <radialGradient id="crt" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset=".85" stop-color="#000" stop-opacity=".15"/>
      <stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </radialGradient>
    <filter id="glo" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gloBig" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="sl" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity=".18"/>
    </pattern>
  </defs>

  <!-- CRT black background -->
  <rect width="900" height="900" fill="#000"/>

  <!-- Subtle amber ambient glow at center -->
  <ellipse cx="450" cy="450" rx="350" ry="350" fill="#FFB000" opacity=".015"/>

  <!-- CRT border frame -->
  <rect x="14" y="14" width="872" height="872" rx="6" fill="none" stroke="#FFB000" stroke-opacity=".2" stroke-width="1.5"/>
  <rect x="18" y="18" width="864" height="864" rx="4" fill="none" stroke="#FFB000" stroke-opacity=".08" stroke-width=".5"/>

  <!-- ═══════ CONTENT ═══════ -->
  <g filter="url(#glo)" class="flk">

    <!-- ——— SYSTEM BOOT HEADER ——— -->
    <g class="ln1" opacity="0">
      <text x="450" y="50" text-anchor="middle" class="th" style="font-size:20px;letter-spacing:6px">WEYLAN-YUTANI CORPORATION</text>
    </g>
    <g class="ln2" opacity="0">
      <text x="450" y="78" text-anchor="middle" class="th" style="font-size:28px;letter-spacing:4px" filter="url(#gloBig)">MU/TH/UR 6000</text>
    </g>
    <g class="ln3" opacity="0">
      <text x="450" y="100" text-anchor="middle" class="t" style="font-size:10px;letter-spacing:6px" opacity=".5">MODELO 182 · MAINFRAME IA 2.1 TERABYTE · SISTEMA INTERATIVO</text>
    </g>

    <!-- Divider -->
    <g class="ln4" opacity="0">
      <text x="36" y="125" class="t vdim" style="font-size:11px">════════════════════════════════════════════════════════════════════════════════</text>
    </g>

    <!-- ——— SHIP STATUS ——— -->
    <g class="ln5" opacity="0">
      <text x="36" y="150" class="t" style="font-size:11px">&gt; NAVE:         USCSS NOSTROMO (REG. 180924609)</text>
    </g>
    <g class="ln6" opacity="0">
      <text x="36" y="168" class="t" style="font-size:11px">&gt; CLASSE:       LOCKHEED CM-88B BISON (M-CLASS)</text>
    </g>
    <g class="ln7" opacity="0">
      <text x="36" y="186" class="t" style="font-size:11px">&gt; TIPO:         REBOCADOR COMERCIAL / CARGUEIRO ESTELAR</text>
    </g>
    <g class="ln8" opacity="0">
      <text x="36" y="204" class="t" style="font-size:11px">&gt; CARGA:        20.000.000 TONELADAS DE MINÉRIO BRUTO</text>
    </g>
    <g class="ln9" opacity="0">
      <text x="36" y="222" class="t" style="font-size:11px">&gt; ROTA:         THEDUS → TERRA</text>
    </g>
    <g class="ln10" opacity="0">
      <text x="36" y="240" class="t" style="font-size:11px">&gt; PROPRIETÁRIA: WEYLAN-YUTANI CORP. — "CONSTRUINDO MUNDOS MELHORES"</text>
    </g>

    <!-- Divider -->
    <g class="ln11" opacity="0">
      <text x="36" y="265" class="t vdim" style="font-size:11px">════════════════════════════════════════════════════════════════════════════════</text>
    </g>

    <!-- ——— CREW MANIFEST ——— -->
    <g class="ln12" opacity="0">
      <text x="36" y="290" class="t" style="font-size:12px;letter-spacing:4px">&gt; MANIFESTO DA TRIPULAÇÃO</text>
    </g>
    <g class="ln13" opacity="0">
      <text x="36" y="312" class="t dim" style="font-size:11px">  01  DALLAS, A.     CAPITÃO / COMANDANTE</text>
    </g>
    <g class="ln14" opacity="0">
      <text x="36" y="330" class="t dim" style="font-size:11px">  02  KANE, T.       OFICIAL EXECUTIVO</text>
    </g>
    <g class="ln15" opacity="0">
      <text x="36" y="348" class="t" style="font-size:11px">  03  RIPLEY, E.     OFICIAL DE GARANTIA             ◄ ATIVO</text>
    </g>
    <g class="ln16" opacity="0">
      <text x="36" y="366" class="t dim" style="font-size:11px">  04  LAMBERT, J.    NAVEGADORA DE VOO</text>
    </g>
    <g class="ln17" opacity="0">
      <text x="36" y="384" class="t dim" style="font-size:11px">  05  ASH            OFICIAL CIENTÍFICO [SINTÉTICO]</text>
    </g>
    <g class="ln18" opacity="0">
      <text x="36" y="402" class="t dim" style="font-size:11px">  06  PARKER, J.     ENGENHEIRO CHEFE</text>
    </g>
    <g class="ln19" opacity="0">
      <text x="36" y="420" class="t dim" style="font-size:11px">  07  BRETT, S.      TÉCNICO DE ENGENHARIA</text>
    </g>
    <g class="ln20" opacity="0">
      <text x="36" y="438" class="t dim" style="font-size:11px">  --  JONES          GATO DA NAVE (NÃO OFICIAL)</text>
    </g>

    <!-- Divider -->
    <g class="ln21" opacity="0">
      <text x="36" y="463" class="t vdim" style="font-size:11px">════════════════════════════════════════════════════════════════════════════════</text>
    </g>

    <!-- ——— OVERRIDE CODE ——— -->
    <g class="ln22" opacity="0">
      <text x="36" y="488" class="t" style="font-size:11px">&gt; RIPLEY, E. — CÓDIGO DE SUBSTITUIÇÃO EMERGENCIAL: 100375</text>
    </g>
    <g class="ln23" opacity="0">
      <text x="36" y="506" class="t" style="font-size:11px">&gt; ACESSO AUTORIZADO — PRIORIDADE MÁXIMA</text>
    </g>
    <g class="ln24" opacity="0">
      <text x="36" y="530" class="t" style="font-size:11px">&gt; ACESSANDO ORDEM ESPECIAL 937...</text>
    </g>

    <!-- Divider -->
    <g class="ln25" opacity="0">
      <text x="36" y="555" class="t vdim" style="font-size:11px">════════════════════════════════════════════════════════════════════════════════</text>
    </g>

    <!-- ——— SPECIAL ORDER 937 ——— -->
    <g class="ln26" opacity="0">
      <text x="450" y="585" text-anchor="middle" class="th" style="font-size:22px;letter-spacing:6px" filter="url(#gloBig)">ORDEM ESPECIAL 937</text>
    </g>
    <g class="ln27" opacity="0">
      <text x="450" y="615" text-anchor="middle" class="t" style="font-size:12px">NOSTROMO REDIRECIONADA PARA NOVAS COORDENADAS.</text>
    </g>
    <g class="ln28" opacity="0">
      <text x="450" y="637" text-anchor="middle" class="t" style="font-size:12px">INVESTIGAR FORMA DE VIDA. COLETAR ESPÉCIME.</text>
    </g>
    <g class="ln29" opacity="0">
      <text x="450" y="665" text-anchor="middle" class="t pulse" style="font-size:14px;letter-spacing:6px">PRIORIDADE UM</text>
    </g>
    <g class="ln30" opacity="0">
      <text x="450" y="690" text-anchor="middle" class="t" style="font-size:12px">GARANTIR RETORNO DO ORGANISMO PARA ANÁLISE.</text>
    </g>
    <g class="ln31" opacity="0">
      <text x="450" y="712" text-anchor="middle" class="t" style="font-size:12px">TODAS AS OUTRAS CONSIDERAÇÕES SECUNDÁRIAS.</text>
    </g>

    <!-- CREW EXPENDABLE — the horror beat -->
    <g class="ln32" opacity="0">
      <text x="450" y="750" text-anchor="middle" class="th alert" style="font-size:26px;letter-spacing:8px" filter="url(#gloBig)">TRIPULAÇÃO PRESCINDÍVEL.</text>
    </g>

    <!-- Divider -->
    <g class="ln33" opacity="0">
      <text x="36" y="785" class="t vdim" style="font-size:11px">════════════════════════════════════════════════════════════════════════════════</text>
    </g>

    <!-- ——— ASH QUOTE ——— -->
    <g class="ln34" opacity="0">
      <text x="450" y="815" text-anchor="middle" class="t dim" style="font-size:11px">"O ORGANISMO PERFEITO. SUA PERFEIÇÃO ESTRUTURAL SÓ É</text>
      <text x="450" y="833" text-anchor="middle" class="t dim" style="font-size:11px">IGUALADA POR SUA HOSTILIDADE." — ASH, OFICIAL CIENTÍFICO</text>
    </g>

    <!-- ——— BOTTOM STATUS + CURSOR ——— -->
    <g class="ln35" opacity="0">
      <text x="36" y="868" class="t" style="font-size:11px">&gt; INTERFACE 2037 PRONTA PARA CONSULTA</text>
      <text x="400" y="868" class="t cur" style="font-size:13px">▌</text>
      <text x="630" y="868" class="t vdim" style="font-size:9px">LV-426 · ZETA² RETICULI · 39 ANOS-LUZ</text>
    </g>

  </g>

  <!-- ═══════ CRT EFFECTS ═══════ -->

  <!-- Scan sweep line -->
  <rect class="sweep" x="0" y="0" width="900" height="4" fill="#FFB000" fill-opacity=".06"/>

  <!-- CRT vignette overlay -->
  <rect width="900" height="900" fill="url(#crt)"/>

  <!-- Heavy scanlines -->
  <rect width="900" height="900" fill="url(#sl)"/>
</svg>
