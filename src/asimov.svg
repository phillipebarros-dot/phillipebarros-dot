<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="Asimov — Biblioteca Neural">
  <defs>
    <style>
      /*FONTS*/
      .t{font-family:'STM',Consolas,monospace}
      .cp{font-family:'CP',sans-serif}
      .scn{animation:scnF 8s ease-in-out infinite}
      @keyframes scnF{0%,100%{opacity:.12}50%{opacity:.18}}
      .cur{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .glow{filter:url(#g)}
    </style>
    <filter id="g" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="wbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1b26"/><stop offset="1" stop-color="#12131e"/>
    </linearGradient>
    <pattern id="sl" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity=".12"/>
    </pattern>
  </defs>

  <!-- Window frame -->
  <rect width="900" height="440" rx="8" fill="url(#wbg)"/>
  <!-- Title bar -->
  <rect width="900" height="36" rx="8" fill="#0f1019"/>
  <rect y="28" width="900" height="8" fill="#0f1019"/>
  <circle cx="20" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="18" r="6" fill="#febc2e"/>
  <circle cx="60" cy="18" r="6" fill="#28c840"/>
  <rect x="80" y="6" width="320" height="24" rx="4" fill="#1a1b26"/>
  <text x="95" y="23" class="t" fill="#787c99" style="font-size:11px">📁 asimov_neural_library.rs — FUNDAÇÃO</text>

  <!-- Line numbers gutter -->
  <rect x="0" y="36" width="44" height="404" fill="#13141f"/>
  <g class="t" fill="#3b3d52" style="font-size:12px">
    <text x="14" y="64">1</text><text x="14" y="82">2</text><text x="14" y="100">3</text>
    <text x="14" y="118">4</text><text x="14" y="136">5</text><text x="14" y="154">6</text>
    <text x="14" y="172">7</text><text x="14" y="190">8</text><text x="14" y="208">9</text>
    <text x="8" y="226">10</text><text x="8" y="244">11</text><text x="8" y="262">12</text>
    <text x="8" y="280">13</text><text x="8" y="298">14</text><text x="8" y="316">15</text>
    <text x="8" y="334">16</text><text x="8" y="352">17</text><text x="8" y="370">18</text>
    <text x="8" y="388">19</text><text x="8" y="406">20</text><text x="8" y="424">21</text>
  </g>

  <!-- Code content -->
  <g class="t glow" style="font-size:13px">
    <!-- Import -->
    <text x="56" y="64"><tspan fill="#c792ea">use </tspan><tspan fill="#00f0ff">asimov</tspan><tspan fill="#c0c0c0">::{</tspan><tspan fill="#ff0055">Lei</tspan><tspan fill="#c0c0c0">, </tspan><tspan fill="#ff0055">Livro</tspan><tspan fill="#c0c0c0">, </tspan><tspan fill="#ff0055">Universo</tspan><tspan fill="#c0c0c0">};</tspan></text>

    <!-- Blank -->

    <!-- Biblioteca struct -->
    <text x="56" y="100" fill="#565a7e">/// A biblioteca que moldou como eu penso sobre máquinas.</text>
    <text x="56" y="118"><tspan fill="#c792ea">pub struct </tspan><tspan fill="#00f0ff">BibliotecaNeural</tspan><tspan fill="#c0c0c0"> {</tspan></text>
    <text x="56" y="136"><tspan fill="#c0c0c0">    fundacao:       </tspan><tspan fill="#ff0055">Livro</tspan><tspan fill="#c0c0c0">,  </tspan><tspan fill="#565a7e">// 1951 — psico-história, predição, colapso imperial</tspan></text>
    <text x="56" y="154"><tspan fill="#c0c0c0">    eu_robo:        </tspan><tspan fill="#ff0055">Livro</tspan><tspan fill="#c0c0c0">,  </tspan><tspan fill="#565a7e">// 1950 — as 3 leis, Susan Calvin, dilemas éticos</tspan></text>
    <text x="56" y="172"><tspan fill="#c0c0c0">    cavernas_aco:   </tspan><tspan fill="#ff0055">Livro</tspan><tspan fill="#c0c0c0">,  </tspan><tspan fill="#565a7e">// 1954 — Elijah Baley, R. Daneel, Terra superlotada</tspan></text>
    <text x="56" y="190"><tspan fill="#c0c0c0">    fim_eternidade: </tspan><tspan fill="#ff0055">Livro</tspan><tspan fill="#c0c0c0">,  </tspan><tspan fill="#565a7e">// 1955 — viagem no tempo, manipulação da realidade</tspan></text>
    <text x="56" y="208"><tspan fill="#c0c0c0">    sol_despido:    </tspan><tspan fill="#ff0055">Livro</tspan><tspan fill="#c0c0c0">,  </tspan><tspan fill="#565a7e">// 1957 — Solaria, isolamento, robôs como extensão</tspan></text>
    <text x="56" y="226"><tspan fill="#c0c0c0">    leis:           [</tspan><tspan fill="#ff0055">Lei</tspan><tspan fill="#c0c0c0">; 4],</tspan><tspan fill="#565a7e"> // Zero a Terceira — a ética que rege tudo</tspan></text>
    <text x="56" y="244"><tspan fill="#c0c0c0">}</tspan></text>

    <!-- Blank -->

    <text x="56" y="280"><tspan fill="#c792ea">impl </tspan><tspan fill="#00f0ff">BibliotecaNeural</tspan><tspan fill="#c0c0c0"> {</tspan></text>
    <text x="56" y="298"><tspan fill="#c0c0c0">    </tspan><tspan fill="#c792ea">pub fn </tspan><tspan fill="#39ff14">impacto</tspan><tspan fill="#c0c0c0">(&amp;self) -&gt; </tspan><tspan fill="#ff0055">Universo</tspan><tspan fill="#c0c0c0"> {</tspan></text>
    <text x="56" y="316"><tspan fill="#c0c0c0">        </tspan><tspan fill="#565a7e">// "A violência é o último recurso dos incompetentes."</tspan></text>
    <text x="56" y="334"><tspan fill="#c0c0c0">        </tspan><tspan fill="#565a7e">//                              — Salvor Hardin, Fundação</tspan></text>
    <text x="56" y="352"><tspan fill="#c0c0c0">        self.leis.</tspan><tspan fill="#39ff14">aplicar</tspan><tspan fill="#c0c0c0">(self.</tspan><tspan fill="#39ff14">fundacao</tspan><tspan fill="#c0c0c0">.</tspan><tspan fill="#39ff14">expandir</tspan><tspan fill="#c0c0c0">())</tspan></text>
    <text x="56" y="370"><tspan fill="#c0c0c0">    }</tspan></text>
    <text x="56" y="388"><tspan fill="#c0c0c0">}</tspan></text>

    <!-- Bottom -->
    <text x="56" y="406" fill="#565a7e">// "Nunca deixe seu senso moral impedir você de fazer o que é certo."</text>
    <text x="56" y="424" fill="#565a7e">//                                             — Isaac Asimov</text>
  </g>

  <!-- Scanlines -->
  <rect width="900" height="440" fill="url(#sl)" class="scn"/>
</svg>
