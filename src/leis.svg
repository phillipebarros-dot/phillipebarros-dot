<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="As Leis da Robótica de Isaac Asimov, como um arquivo C">
  <defs>
    <style>
      /*FONTS*/
      text { font-family:'STM', Consolas, monospace; font-size:15.5px; }
      .n  { fill:#3b4350; }
      .c  { fill:#5d6b7a; }
      .pp { fill:#ff5c8a; }
      .k  { fill:#00f0ff; }
      .s  { fill:#fcee0a; }
      .tx { fill:#d9dde3; }
      .aba { font-family:'CP'; font-size:13px; letter-spacing:1px; }
      .cursor { animation: cur 1s steps(1) infinite; }
      @keyframes cur { 50% { opacity:0 } }
    </style>
  </defs>
  <rect width="1200" height="380" rx="6" fill="#0a0c10"/>
  <rect width="1200" height="38" rx="6" fill="#11141a"/>
  <rect y="30" width="1200" height="8" fill="#11141a"/>
  <polygon points="16,38 16,10 182,10 198,38" fill="#0a0c10"/>
  <text x="34" y="29" class="aba" fill="#fcee0a">robotica.h</text>
  <text x="226" y="29" class="aba" fill="#4a5361">cerebro_positronico.c</text>
  <text x="1180" y="27" text-anchor="end" style="font-size:12px" class="c">U.S. ROBOTS AND MECHANICAL MEN, INC.</text>

  <g transform="translate(0 72)">
    <text x="22" class="n">1</text><text x="64" class="c">/* Isaac Asimov, "Andando em círculos" (1942). A Lei Zero veio depois, em "Os Robôs e o Império" (1985). */</text>
    <text x="22" y="28" class="n">2</text><text x="64" y="28"><tspan class="pp">#pragma</tspan><tspan class="tx"> once</tspan></text>
    <text x="22" y="56" class="n">3</text>
    <text x="22" y="84" class="n">4</text><text x="64" y="84"><tspan class="k">static const char</tspan><tspan class="tx"> *LEIS[] = {</tspan></text>
    <text x="22" y="112" class="n">5</text><text x="96" y="112" class="s">"0. Um robô não pode causar mal à humanidade ou, por omissão, permitir que a humanidade sofra algum mal.",</text>
    <text x="22" y="140" class="n">6</text><text x="96" y="140" class="s">"1. Um robô não pode ferir um ser humano ou, por inação, permitir que um ser humano sofra algum mal.",</text>
    <text x="22" y="168" class="n">7</text><text x="96" y="168" class="s">"2. Um robô deve obedecer às ordens dadas por seres humanos, exceto quando entrarem em conflito "</text>
    <text x="22" y="196" class="n">8</text><text x="128" y="196" class="s">"com a Primeira Lei.",</text>
    <text x="22" y="224" class="n">9</text><text x="96" y="224" class="s">"3. Um robô deve proteger a própria existência, desde que isso não entre em conflito com a "</text>
    <text x="16" y="252" class="n">10</text><text x="128" y="252" class="s">"Primeira ou a Segunda Lei."</text>
    <text x="16" y="280" class="n">11</text><text x="64" y="280" class="tx">};<tspan class="cursor" fill="#00f0ff"> ▌</tspan></text>
  </g>
</svg>
