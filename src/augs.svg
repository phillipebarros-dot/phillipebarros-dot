<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Aumentos: as stacks de Phillipe Barros">
  <defs>
    <style>
      /*FONTS*/
      .ttl { font-family:'CP'; font-size:40px; letter-spacing:6px; fill:#e7b04a; }
      .sub { font-family:'STM', Consolas, monospace; font-size:13px; letter-spacing:3px; fill:#8a7340; }
      .cod { font-family:'STM', Consolas, monospace; font-size:12px; letter-spacing:2px; fill:#e7b04a; }
      .cat { font-family:'CP'; font-size:21px; letter-spacing:2px; fill:#f3f1ea; }
      .it  { font-family:'STM', Consolas, monospace; font-size:15px; fill:#c9c3b3; }
      .on  { animation: on 3s ease-in-out infinite; }
      @keyframes on { 0%,100% { opacity:.35 } 50% { opacity:1 } }
      .varre { animation: varre 5s linear infinite; }
      @keyframes varre { from { transform: translateY(-80px) } to { transform: translateY(640px) } }
    </style>
    <pattern id="hex" width="28" height="48.5" patternUnits="userSpaceOnUse" patternTransform="scale(1.2)">
      <path d="M14 0 L28 8.08 V24.25 L14 32.33 L0 24.25 V8.08 Z M14 32.33 V48.5" fill="none" stroke="#e7b04a" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <linearGradient id="feixe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7b04a" stop-opacity="0"/>
      <stop offset=".5" stop-color="#e7b04a" stop-opacity=".07"/>
      <stop offset="1" stop-color="#e7b04a" stop-opacity="0"/>
    </linearGradient>
    <symbol id="card" viewBox="0 0 270 214">
      <polygon points="0,0 250,0 270,20 270,214 20,214 0,194" fill="#0e0d0b" stroke="#3a3122" stroke-width="1.5"/>
      <polyline points="0,40 0,0 40,0" fill="none" stroke="#e7b04a" stroke-width="2"/>
      <polyline points="270,174 270,214 230,214" fill="none" stroke="#e7b04a" stroke-width="2"/>
    </symbol>
  </defs>

  <rect width="1200" height="600" fill="#080807"/>
  <rect width="1200" height="600" fill="url(#hex)"/>
  <rect class="varre" x="0" y="0" width="1200" height="80" fill="url(#feixe)"/>

  <text x="40" y="64" class="ttl">AUMENTOS</text>
  <text x="44" y="92" class="sub">SARIF INDUSTRIES  //  STATUS: INSTALADO  //  EU NUNCA PEDI POR ISSO</text>
  <circle class="on" cx="1148" cy="54" r="5" fill="#e7b04a"/>
  <text x="1134" y="59" text-anchor="end" class="sub" style="fill:#e7b04a">ATIVO</text>
  <line x1="40" y1="110" x2="1160" y2="110" stroke="#3a3122"/>

  <!-- linha 1 -->
  <g transform="translate(40 132)">
    <use href="#card" width="270" height="214"/>
    <text x="22" y="34" class="cod">AUG-01</text><text x="22" y="62" class="cat">CÓRTEX</text>
    <text x="22" y="98" class="it">TypeScript</text><text x="22" y="122" class="it">JavaScript</text><text x="22" y="146" class="it">Python</text><text x="22" y="170" class="it">Java</text><text x="22" y="194" class="it">SQL</text>
  </g>
  <g transform="translate(326 132)">
    <use href="#card" width="270" height="214"/>
    <text x="22" y="34" class="cod">AUG-02</text><text x="22" y="62" class="cat">ÓPTICA</text>
    <text x="22" y="98" class="it">React</text><text x="22" y="122" class="it">Next.js</text><text x="22" y="146" class="it">Vite</text><text x="22" y="170" class="it">TailwindCSS</text>
  </g>
  <g transform="translate(612 132)">
    <use href="#card" width="270" height="214"/>
    <text x="22" y="34" class="cod">AUG-03</text><text x="22" y="62" class="cat">COLUNA</text>
    <text x="22" y="98" class="it">FastAPI</text><text x="22" y="122" class="it">Spring Boot</text><text x="22" y="146" class="it">Node.js</text><text x="22" y="170" class="it">REST · Webhooks</text>
  </g>
  <g transform="translate(898 132)">
    <use href="#card" width="270" height="214"/>
    <text x="22" y="34" class="cod">AUG-04</text><text x="22" y="62" class="cat">LINK NEURAL</text>
    <text x="22" y="98" class="it">LangGraph</text><text x="22" y="122" class="it">LangChain</text><text x="22" y="146" class="it">Claude</text><text x="22" y="170" class="it">MCP</text><text x="22" y="194" class="it">RAG</text>
  </g>

  <!-- linha 2 -->
  <g transform="translate(40 364)">
    <use href="#card" width="270" height="214"/>
    <text x="22" y="34" class="cod">AUG-05</text><text x="22" y="62" class="cat">NUVEM</text>
    <text x="22" y="98" class="it">Google Cloud</text><text x="22" y="122" class="it">Cloud Run · Cloud SQL</text><text x="22" y="146" class="it">IAM · IAP</text><text x="22" y="170" class="it">Oracle Cloud</text><text x="22" y="194" class="it">Docker · Nginx</text>
  </g>
  <g transform="translate(326 364)">
    <use href="#card" width="270" height="214"/>
    <text x="22" y="34" class="cod">AUG-06</text><text x="22" y="62" class="cat">MEMÓRIA</text>
    <text x="22" y="98" class="it">PostgreSQL</text><text x="22" y="122" class="it">MySQL · MariaDB</text><text x="22" y="146" class="it">BigQuery</text><text x="22" y="170" class="it">n8n · Kestra</text>
  </g>
  <g transform="translate(612 364)">
    <use href="#card" width="270" height="214"/>
    <text x="22" y="34" class="cod">AUG-07</text><text x="22" y="62" class="cat">QUEBRA-GELO</text>
    <text x="22" y="98" class="it">OWASP · WSTG</text><text x="22" y="122" class="it">Burp Suite · ZAP</text><text x="22" y="146" class="it">Metasploit</text><text x="22" y="170" class="it">Nmap · Wireshark</text>
  </g>
  <g transform="translate(898 364)">
    <use href="#card" width="270" height="214"/>
    <text x="22" y="34" class="cod">AUG-08</text><text x="22" y="62" class="cat">EXOESQUELETO</text>
    <text x="22" y="98" class="it">Linux · Windows Server</text><text x="22" y="122" class="it">Proxmox · Zabbix</text><text x="22" y="146" class="it">OpenVPN · iptables</text><text x="22" y="170" class="it">PowerShell · Bash</text><text x="22" y="194" class="it">Git · CI/CD</text>
  </g>
</svg>
