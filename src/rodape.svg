<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="Todos esses momentos se perderão no tempo, como lágrimas na chuva. Roy Batty, Blade Runner">
  <defs>
    <style>
      /*FONTS*/
      .q { font-family:'CPm'; font-size:30px; letter-spacing:1px; fill:#e9e6dc; }
      .a { font-family:'STM', Consolas, monospace; font-size:13px; letter-spacing:3px; fill:#5fa9b8; }
      .chuva { animation: cai 1.1s linear infinite; }
      @keyframes cai { from { transform: translate(0,-200px) } to { transform: translate(-40px,0) } }
      .respira { animation: resp 5s ease-in-out infinite; }
      @keyframes resp { 0%,100% { opacity:.55 } 50% { opacity:1 } }
    </style>
    <linearGradient id="f" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070b"/>
      <stop offset="1" stop-color="#0b1216"/>
    </linearGradient>
    <pattern id="pingos" width="60" height="200" patternUnits="userSpaceOnUse">
      <line x1="10" y1="0" x2="4" y2="26" stroke="#9fd8e8" stroke-opacity=".18"/>
      <line x1="38" y1="70" x2="32" y2="96" stroke="#9fd8e8" stroke-opacity=".12"/>
      <line x1="52" y1="140" x2="46" y2="166" stroke="#9fd8e8" stroke-opacity=".16"/>
    </pattern>
  </defs>
  <rect width="1200" height="190" fill="url(#f)"/>
  <g class="chuva"><rect x="-40" y="0" width="1280" height="420" fill="url(#pingos)"/></g>
  <line x1="0" y1="0.5" x2="1200" y2="0.5" stroke="#fcee0a" stroke-opacity=".5"/>
  <text x="600" y="92" text-anchor="middle" class="q respira">Todos esses momentos se perderão no tempo, como lágrimas na chuva.</text>
  <text x="600" y="128" text-anchor="middle" class="a">ROY BATTY  ::  NEXUS-6  ::  BLADE RUNNER  ::  LOS ANGELES, 2019</text>
</svg>
